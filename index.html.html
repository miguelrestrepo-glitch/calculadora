<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora JavaScript</title>
<style>
button { padding: 6px 10px; margin: 2px; cursor: pointer; }
</style>
</head>
<body>
<h1>Calculadora</h1>
<div class="contenedor">

<div class="panel">
<h2>Números</h2>
<input type="number" id="n1">
<input type="number" id="n2">
<input type="number" id="n3">
<button onclick="sumar()">Sumar</button>
<button onclick="restar()">Restar</button>
<button onclick="multiplicar()">Multiplicar</button>
<button onclick="dividir()">Dividir</button>
<button onclick="sacarRaiz()">SacarRaiz</button>
<button onclick="esMultiplo()">EsMultiplo</button>
<button onclick="compararNumeros()">Comparar</button>
<input type="text" id="resNumeros" readonly>
</div>

<div class="panel">
<h2>Cadenas</h2>
<input type="text" id="t1">
<input type="text" id="t2">
<button onclick="compararTextos()">Comparar</button>
<button onclick="contar()">Contar</button>
<button onclick="espacios()">Espacios</button>
<button onclick="insertar()">Insertar</button>
<input type="text" id="resTextos" readonly>
</div>

<div class="panel">
<h2>Vectores</h2>
<input type="text" id="vector">
<button onclick="crear()">Crear</button>
<button onclick="sumarVector()">Sumar</button>
<button onclick="pares()">Pares</button>
<input type="text" id="resVector" readonly>
</div>

</div>

<script>
function valor(id) {
    return document.getElementById(id).value;
}

function mostrar(id, texto) {
    document.getElementById(id).value = texto;
}

function sumar() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese al menos dos valores");
        return;
    }
    let resultado = Number(valor("n1")) + Number(valor("n2"));
    if (valor("n3") !== "") {
        resultado = resultado + Number(valor("n3"));
    }
    mostrar("resNumeros", resultado);
}

function restar() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese al menos dos valores");
        return;
    }
    let resultado = Number(valor("n1")) - Number(valor("n2"));
    if (valor("n3") !== "") {
        resultado = resultado - Number(valor("n3"));
    }
    mostrar("resNumeros", resultado);
}

function multiplicar() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese al menos dos valores");
        return;
    }
    let resultado = Number(valor("n1")) * Number(valor("n2"));
    if (valor("n3") !== "") {
        resultado = resultado * Number(valor("n3"));
    }
    mostrar("resNumeros", resultado);
}

function dividir() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese los dos primeros valores");
        return;
    }
    if (Number(valor("n2")) === 0) {
        mostrar("resNumeros", "No se puede dividir entre cero");
        return;
    }
    mostrar("resNumeros", Number(valor("n1")) / Number(valor("n2")));
}

function sacarRaiz() {
    if (valor("n1") === "") {
        mostrar("resNumeros", "Ingrese el primer valor");
        return;
    }
    if (Number(valor("n1")) < 0) {
        mostrar("resNumeros", "No existe raíz de un numero negativo");
        return;
    }
    mostrar("resNumeros", Math.sqrt(Number(valor("n1"))));
}

function esMultiplo() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese los dos primeros valores");
        return;
    }
    let a = Number(valor("n1"));
    let b = Number(valor("n2"));
    if (b === 0) {
        mostrar("resNumeros", "El segundo valor no puede ser cero");
        return;
    }
    if (a % b === 0) {
        mostrar("resNumeros", a + " es múltiplo de " + b);
    } else {
        mostrar("resNumeros", a + " no es múltiplo de " + b);
    }
}

function compararNumeros() {
    if (valor("n1") === "" || valor("n2") === "") {
        mostrar("resNumeros", "Ingrese los dos primeros valores");
        return;
    }
    let a = Number(valor("n1"));
    let b = Number(valor("n2"));
    if (a > b) {
        mostrar("resNumeros", a + " es mayor que " + b);
    } else if (b > a) {
        mostrar("resNumeros", b + " es mayor que " + a);
    } else {
        mostrar("resNumeros", "Los valores son iguales");
    }
}

function compararTextos() {
    let a = valor("t1");
    let b = valor("t2");
    if (a === "" || b === "") {
        mostrar("resTextos", "Ingrese los dos textos");
        return;
    }
    if (a.length > b.length) {
        mostrar("resTextos", "El primer texto es más grande");
    } else if (b.length > a.length) {
        mostrar("resTextos", "El segundo texto es más grande");
    } else {
        mostrar("resTextos", "Ambos textos tienen el mismo tamaño");
    }
}

function contar() {
    let texto = valor("t1");
    let caracter = valor("t2");
    if (texto === "" || caracter === "") {
        mostrar("resTextos", "Ingrese los dos textos");
        return;
    }
    caracter = caracter.charAt(0);
    let cantidad = 0;
    for (let i = 0; i < texto.length; i++) {
        if (texto.charAt(i) === caracter) {
            cantidad++;
        }
    }
    if (cantidad === 0) {
        mostrar("resTextos", "El carácter '" + caracter + "' no se encontró");
    } else {
        mostrar("resTextos", "El carácter '" + caracter + "' aparece " + cantidad + " veces");
    }
}

function espacios() {
    let texto = valor("t1");
    if (texto === "") {
        mostrar("resTextos", "Ingrese el primer texto");
        return;
    }
    mostrar("resTextos", texto.split(" ").join(""));
}

function insertar() {
    let a = valor("t1");
    let b = valor("t2");
    if (a === "" || b === "") {
        mostrar("resTextos", "Ingrese los dos textos");
        return;
    }
    let mitad = Math.ceil(a.length / 2);
    mostrar("resTextos", a.substring(0, mitad) + b + a.substring(mitad));
}

function crear() {
    let texto = valor("vector");
    if (texto === "") {
        mostrar("resVector", "Ingrese números separados por coma");
        return;
    }
    let arreglo = texto.split(",");
    mostrar("resVector", arreglo.join(","));
}

function sumarVector() {
    let texto = valor("vector");
    if (texto === "") {
        mostrar("resVector", "Ingrese números separados por coma");
        return;
    }
    
    let arreglo = texto.split(",");
    let suma = 0;
    
    for (let i = 0; i < arreglo.length; i++) {
       
        if (isNaN(Number(arreglo[i]))) {
            mostrar("resVector", "Error: No se permiten letras");
            return;
        }
        suma = suma + Number(arreglo[i]);
    }
    
    mostrar("resVector", suma);
}

function pares() {
    let texto = valor("vector");
    if (texto === "") {
        mostrar("resVector", "Ingrese números separados por coma");
        return;
    }
    let arreglo = texto.split(",");
    let producto = 1;
    for (let i = 0; i < arreglo.length; i += 2) {
        producto = producto * Number(arreglo[i]);
    }
    mostrar("resVector", producto);
}


</script>
</body>
</html>
